# Distillery Expo — default config (M1)
# dongle_id: set via GUI Save (POST /dongle) or DISTILLERY_DONGLE_ID — no demo default

hardware:
  mici:
    connect: comma  # comma Connect + local/SSH
    cams: [road, wide, driver]
  teacher_gpu: "AMD Radeon RX 7090 XT"
  # NO Chestnut in v1

ingest:
  # Primary: Connect (COMMA_JWT) → SSH (MICI_SSH_HOST) → fixture
  # Set force_fixture: true for offline / CI without device creds
  force_fixture: false

teacher:
  name: "big_driving_supercombo"
  device: "7090 XT"
  # placeholder — real weights wired in later milestone
  checkpoint: null
  # Big teacher ONNX cache (commaai/openpilot@master) — no small-model fallback
  teachers_dir: artifacts/teachers

student:
  name: "stock-modelV2-I/O"
  target: "mici/QCOM"
  # I/O compatible with stock modelV2
  io_compatible: true
  checkpoint: null
  min_train_hours: 50
  # CI only — still live=false / not licensed
  allow_toy_train: false

pipeline:
  stages:
    - ingest
    - shard
    - teach
    - train
    - export
    - eval
    - flash
  flash_gated: true  # always require explicit confirm

api:
  host: "0.0.0.0"
  port: 8000

web:
  port: 5173

# M2 shard packing
shards:
  window_frames: 120
  fps: 20
  output_dir: artifacts/shards
  force_fixture: false

eval:
  min_train_hours: 50
  allow_toy_train: false
